<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Hanging Decoration -->
    <div class="decoration">
        <div class="flags">
            <span>◆</span><span>◆</span><span>◆</span>
            <span>◆</span><span>◆</span><span>◆</span>
            <span>◆</span><span>◆</span><span>◆</span>
        </div>
    </div>

    <!-- Floating Hearts -->
    <div class="hearts" id="hearts"></div>

    <!-- Birthday Title -->
    <main class="birthday-container">

        <div class="birthday-title">
            <h1>Happy</h1>
            <h1 class="pink-text">Birthday</h1>
        </div>

        <div class="date">
            <span>20 OCTOBER</span>
        </div>

        <!-- Main Image -->
        <div class="main-character">
            <img src="./OIshe.jpeg" alt="Birthday Cartoon">
        </div>

        <!-- Buttons -->
        <div class="buttons">
            <button id="openLetter">Open Me!</button>
        </div>

    </main>

    <!-- Like Button -->
    <div class="like-box" id="likeButton">
        <span class="heart-icon">♡</span>
        <span>Likes</span>
    </div>

    <!-- Letter Popup -->
    <div class="overlay" id="overlay">
        <div class="letter">

            <button class="close-btn" id="closeLetter">×</button>

            <div class="letter-header">
                <h3>To you...</h3>
            </div>

            <div class="letter-content">

                <div class="letter-image">
                    <img src="./WhatsApp Image 2026-10-05 at 11.13.21 PM.jpeg" alt="Cute Birthday Cartoon">
                </div>

                <div class="letter-text">
                    <h4>Happy Birthday!</h4>

                    <p>
                        Wishing you a day full of happiness,
                        smiles and beautiful memories.
                    </p>

                    <p>
                        May your dreams come true and
                        may every day bring you joy.
                    </p>

                    <p class="signature">
                        Happy Birthday to you!
                    </p>
                </div>

            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
